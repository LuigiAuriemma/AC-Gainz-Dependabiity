name: Java CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# --- VARIABILI GLOBALI ---
env:
  JAVA_VERSION: "21"
  JAVA_DISTRO: "temurin"

jobs:
  # --- JOB 1: SECURITY SCANNING ---
  security:
    name: 🛡️ Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- GitGuardian Secret Scanning ---
      - name: GitGuardian Scan
        uses: GitGuardian/ggshield-action@v1
        continue-on-error: true
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base_ref }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      # --- Snyk Security Scanning ---
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}
          cache: maven

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Fix Maven Wrapper permissions
        run: chmod +x mvnw

      # Scansione Dipendenze (Salva output su file e console tramite 'tee')
      - name: Snyk Open Source (Dependencies)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=pom.xml --severity-threshold=high | tee snyk_dependencies_report.txt

      # Scansione Codice SAST (Salva output su file e console tramite 'tee')
      - name: Snyk Code (SAST)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test | tee snyk_code_report.txt

      # --- SALVATAGGIO REPORT SICUREZZA ---
      - name: 💾 Upload Security Reports
        if: always() # Esegui anche se vengono trovate vulnerabilità
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            snyk_dependencies_report.txt
            snyk_code_report.txt
          retention-days: 15

  # --- JOB 2: TEST & COVERAGE ---
  test:
    name: 🧪 Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}
          cache: maven

      # Genera i report di test e coverage
      - name: Run Tests and Generate Coverage
        run: mvn -B verify --file pom.xml

      # Invio a Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          fail_ci_if_error: true
          verbose: true

      # --- SALVATAGGIO REPORT TEST ---
      - name: 💾 Upload Test & Coverage Reports
        if: always() # Esegui anche se i test falliscono
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 15

  # --- JOB 3: BUILD E DEPLOY ---
  build_and_push_docker:
    name: 🐳 Build & Push Docker
    needs: [security, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # App Image
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ac-gainz-dependability

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # DB Image
      - name: Extract Docker metadata (DB)
        id: meta-db
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ac-gainz-dependabilitydb

      - name: Build and push Docker image (DB)
        uses: docker/build-push-action@v5
        with:
          context: ./DB
          file: ./DB/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-db.outputs.tags }}
          labels: ${{ steps.meta-db.outputs.labels }}
